name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Artifacts
        working-directory: frontend
        run: npm run build

  test-backend:
    name: Backend Test & Django Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-test-safe-secret-key"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py check

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: "ci-test-safe-secret-key"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py test api

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up kubeval / kubectl dry-run
        run: |
          sudo snap install kubectl --classic
          for file in deploy/kubernetes/*.yaml; do
            echo "Validating $file syntax..."
            kubectl apply --dry-run=client -f "$file" || echo "Note: templated variables evaluated at deploy time"
          done

  verify-docker-build:
    name: Verify Container Image Builds
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: portfolio-frontend:test

      - name: Build Backend Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: portfolio-backend:test
