<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#070c14" stroke="url(#ringGrad)" stroke-width="2.5" />
  
  <!-- Optical Camera Focus Reticle / Corner Brackets -->
  <path d="M 22 36 L 22 24 L 34 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M 106 36 L 106 24 L 94 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M 22 92 L 22 104 L 34 104" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M 106 92 L 106 104 L 94 104" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Center Core Radial Glow -->
  <circle cx="64" cy="64" r="38" fill="url(#coreGlow)" />

  <!-- Aperture Outer Ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-dasharray="7 5" opacity="0.75" />

  <!-- Monogram 'PV' Stylized Geometric Letterforms -->
  <!-- 'P' -->
  <path d="M 40 40 L 40 88 M 40 40 L 56 40 C 66 40 66 58 56 58 L 40 58" 
        fill="none" 
        stroke="url(#cyberGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- 'V' -->
  <path d="M 64 54 L 78 88 L 92 54" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Computer Vision Neural Detection Focal Dot -->
  <circle cx="78" cy="42" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
</svg>
